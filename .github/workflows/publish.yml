name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version: $PACKAGE_VERSION"
            echo "GitHub Release version: $RELEASE_VERSION"
            echo "The package version and release tag must match."
            exit 1
          fi

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public